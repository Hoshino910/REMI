# REMI v0.2 / DeepSeek Harness 0.1.5 agent-preset fragment.
# Replace the preset's entire existing `id: compaction` group with this group.
# IMPORTANT: change the absolute Windows path below to this repository's built
# packages/dsh-adapter/dist/index.js. Run `pnpm install` and `pnpm build` here first.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: selective-memory
      name: 'file:///C:/absolute/path/to/dsh-selective-memory/packages/dsh-adapter/dist/index.js'
      config:
        databasePath: 'C:/absolute/path/to/dsh-data/memory.sqlite'
        telemetryPath: 'C:/absolute/path/to/dsh-data/memory-telemetry.jsonl'
        telemetryEnabled: true
        retrievalTokenBudget: 1400
        retrievalLimit: 8
        minRetrievalScore: 0.12
        transparentWindowEnabled: true
        similarityWeight: 0.55
        recencyWeight: 0.15
        importanceWeight: 0.10
        associationWeight: 0.15
        emotionWeight: 0.05
        hebbianEnabled: true
        hebbianSeedLimit: 4
        hebbianEdgeLimit: 256
        hebbianLearningRate: 0.08
        hebbianMaxWeight: 1
        hebbianHalfLifeDays: 45
        # Optional: uses the currently routed DSH model unless both fields are set.
        # This is an inference-only JSON classification call; it never trains a model.
        emotionAnalysisEnabled: false
        emotionAnalysisProvider: ''
        emotionAnalysisModel: ''
        emotionAnalysisMaxTokens: 160
        compactionSummaryTokenBudget: 900
        compactionThresholdRatio: 0.80
        compactionRetainRatio: 0.16
        autoCompaction: true

    # The command is backend-independent and resolves this group's compaction service.
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
